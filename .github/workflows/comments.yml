name: Comments

# Manual only: posts the channel's own first comment (the video's comment question) on each video once it is public, and sends new viewer comments
# to Telegram with a numbered draft reply; it posts a reply ONLY after the owner answers that Telegram message (ok N / skip N / N: own words). Its ledger lives on the `state-comments` branch.
on:
  # The 15-minute schedule was removed on 2026-11-02: the owner replies to comments by hand. Run it manually from the Actions tab if needed.
  workflow_dispatch:

concurrency:
  group: comments
  cancel-in-progress: false

permissions:
  contents: write   # to update the `state-comments` branch

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_REFRESH_TOKEN_ML: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ML }}
      YOUTUBE_REFRESH_TOKEN_DATA: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DATA }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Post first comments and announce new viewer comments
        run: python scripts/comments_run.py
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/comments.yml/enable" || echo "keepalive call failed (non-fatal)"
