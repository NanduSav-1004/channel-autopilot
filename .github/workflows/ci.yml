name: CI
# Lint, tests and the secret scan now run locally before every push (scripts/check.sh, .githooks/pre-push).
# This workflow is the optional full check (it includes gitleaks): run it by hand from the Actions tab.
on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (the render tests run the real ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-lato fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
