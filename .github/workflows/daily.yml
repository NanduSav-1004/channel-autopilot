name: Daily video

on:
  schedule:
    # GitHub's scheduler is best-effort: runs are delayed or dropped. The main trigger is an EXTERNAL timer (cron-job.org, from 2 Nov 2026) calling
    # workflow_dispatch; these are backups. The free Gemini quotas reset at midnight Pacific time: 07:00 UTC in summer, 08:00 UTC from the first
    # Sunday of November (1 Nov 2026) until March. A run before the reset meets exhausted quotas (on 2 Nov the Malayalam voice fell back to the
    # worst model), so no backup is earlier than 08:17 UTC. The run skips itself if today's video is already up.
    - cron: "17 8 * * *"
    - cron: "43 9 * * *"
    - cron: "11 11 * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Run exactly like a scheduled run (live, privacy from UPLOAD_PRIVACY): this is what the external timer sends"
        type: boolean
        default: false
      live:
        description: "Really upload to YouTube (otherwise dry run)"
        type: boolean
        default: false
      redo_en_shorts:
        description: "Remake today's English Shorts at these positions, e.g. 0,1 (deletes the old ones while still private and scheduled)"
        type: string
        default: ""
      redo_ml_long:
        description: "Delete today's still-private Malayalam long video AND its Shorts and make them again"
        type: boolean
        default: false
      redo_ml_shorts:
        description: "Delete today's still-private Malayalam Shorts and make them again"
        type: boolean
        default: false
      privacy:
        description: "Privacy for uploaded videos"
        type: choice
        options: [private, unlisted, public]
        default: private

# One run at a time: the job database is a single file.
concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write   # to update the `state` branch
  actions: write    # so a run can re-enable its own schedule (keepalive)

jobs:
  make-video:
    # Manual runs always work. Scheduled runs only run once the repo variable AUTOPILOT_ENABLED is "true".
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY_ML: ${{ secrets.GEMINI_API_KEY_ML }}
      YOUTUBE_REFRESH_TOKEN_ML: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ML }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (fonts for captions and thumbnails)
        timeout-minutes: 25
        run: scripts/install_system_packages.sh

      - id: install
        run: pip install --retries 5 --timeout 60 -e .

      - name: Cache voice models
        id: voice
        uses: actions/cache@v4
        with:
          path: models
          key: voices-v2-piper-lessac-kokoro-1.0

      - name: Download voice models
        if: steps.voice.outputs.cache-hit != 'true'
        run: |
          python -m piper.download_voices en_US-lessac-medium --download-dir models
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL --fail -o models/kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          curl -sL --fail -o models/voices-v1.0.bin $B/voices-v1.0.bin

      - name: Restore job database
        run: scripts/state_sync.sh pull

      - name: Make today's video
        shell: bash
        run: |
          # Scheduled runs upload for real. Privacy comes from the repo variable UPLOAD_PRIVACY (default public).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scheduled }}" != "true" ]; then
            LIVE="${{ inputs.live }}"; PRIVACY="${{ inputs.privacy }}"
          else
            LIVE="true"; PRIVACY="${{ vars.UPLOAD_PRIVACY || 'public' }}"
          fi
          ARGS="daily --privacy $PRIVACY"
          [ "$LIVE" = "true" ] && ARGS="$ARGS --live"
          [ -n "${{ inputs.redo_en_shorts }}" ] && ARGS="$ARGS --redo-en-shorts ${{ inputs.redo_en_shorts }}"
          autopilot $ARGS 2>&1 | tee run.log

      - name: Malayalam edition (a second channel; skipped until its login exists, and never affects the English video)
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scheduled }}" != "true" ]; then
            LIVE="${{ inputs.live }}"; PRIVACY="${{ inputs.privacy }}"
          else
            LIVE="true"; PRIVACY="${{ vars.UPLOAD_PRIVACY || 'public' }}"
          fi
          ARGS="ml --auto --privacy $PRIVACY"
          [ "$LIVE" = "true" ] && ARGS="$ARGS --live"
          # a manual run retries a Malayalam edition that failed earlier today; the scheduled backups do not
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scheduled }}" != "true" ] && ARGS="$ARGS --retry"
          [ "${{ inputs.redo_ml_shorts }}" = "true" ] && ARGS="$ARGS --redo-shorts"
          [ "${{ inputs.redo_ml_long }}" = "true" ] && ARGS="$ARGS --redo-long"
          autopilot $ARGS 2>&1 | tee -a run.log

      - name: Keep the Malayalam edition for review (only when it was built but not uploaded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-edition-${{ github.run_id }}
          path: |
            output/*/ml/final.mp4
            output/*/short*/ml/final.mp4
            output/*/ml/thumbnail.jpg
            output/*/ml/script_ml.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Save job database
        if: always()
        run: scripts/state_sync.sh push

      - name: Alert if the run failed
        if: failure()
        run: python3 scripts/watchdog_fail.py || true

      - name: Keepalive (GitHub disables scheduled workflows after 60 days without repo activity)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable" || echo "keepalive call failed (non-fatal)"

      - name: Job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          autopilot status | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep small debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            output/*/script.json
            output/*/qa_issues.json
            output/*/credits.json
          retention-days: 3
