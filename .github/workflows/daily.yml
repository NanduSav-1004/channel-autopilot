name: Daily video

on:
  schedule:
    # GitHub's scheduler is best-effort: runs are delayed or dropped, most often on the hour. So: three off-peak
    # attempts, after the free-tier quotas reset (07:00 UTC). The run skips itself if today's video is already up.
    # Observed on 2026-10-22/23: GitHub started these 5+ hours late (or not at all), which can push the upload past the
    # 18:00 UTC go-live slot. So two EARLY slots come first: a 5-hour delay from 02:17 still lands before 08:00 UTC.
    - cron: "17 2 * * *"
    - cron: "43 4 * * *"
    - cron: "17 8 * * *"
    - cron: "43 9 * * *"
    - cron: "11 11 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Really upload to YouTube (otherwise dry run)"
        type: boolean
        default: false
      privacy:
        description: "Privacy for uploaded videos"
        type: choice
        options: [private, unlisted, public]
        default: private

# One run at a time: the job database is a single file.
concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write   # to update the `state` branch
  actions: write    # so a run can re-enable its own schedule (keepalive)

jobs:
  make-video:
    # Manual runs always work. Scheduled runs only run once the repo variable AUTOPILOT_ENABLED is "true".
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY_ML: ${{ secrets.GEMINI_API_KEY_ML }}
      YOUTUBE_REFRESH_TOKEN_ML: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ML }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (fonts for captions and thumbnails)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-lato fonts-dejavu-core fonts-noto-core ffmpeg

      - run: pip install -e .

      - name: Cache voice models
        id: voice
        uses: actions/cache@v4
        with:
          path: models
          key: voices-v2-piper-lessac-kokoro-1.0

      - name: Download voice models
        if: steps.voice.outputs.cache-hit != 'true'
        run: |
          python -m piper.download_voices en_US-lessac-medium --download-dir models
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL --fail -o models/kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          curl -sL --fail -o models/voices-v1.0.bin $B/voices-v1.0.bin

      - name: Restore job database
        run: scripts/state_sync.sh pull

      - name: Make today's video
        shell: bash
        run: |
          # Scheduled runs upload for real. Privacy comes from the repo variable UPLOAD_PRIVACY (default public).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIVE="${{ inputs.live }}"; PRIVACY="${{ inputs.privacy }}"
          else
            LIVE="true"; PRIVACY="${{ vars.UPLOAD_PRIVACY || 'public' }}"
          fi
          ARGS="daily --privacy $PRIVACY"
          [ "$LIVE" = "true" ] && ARGS="$ARGS --live"
          autopilot $ARGS 2>&1 | tee run.log

      - name: Malayalam edition (a second channel; skipped until its login exists, and never affects the English video)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIVE="${{ inputs.live }}"; PRIVACY="${{ inputs.privacy }}"
          else
            LIVE="true"; PRIVACY="${{ vars.UPLOAD_PRIVACY || 'public' }}"
          fi
          ARGS="ml --auto --privacy $PRIVACY"
          [ "$LIVE" = "true" ] && ARGS="$ARGS --live"
          autopilot $ARGS 2>&1 | tee -a run.log

      - name: Keep the Malayalam edition for review (only when it was built but not uploaded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-edition-${{ github.run_id }}
          path: |
            output/*/ml/final.mp4
            output/*/short*/ml/final.mp4
            output/*/ml/thumbnail.jpg
            output/*/ml/script_ml.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Save job database
        if: always()
        run: scripts/state_sync.sh push

      - name: Alert if the run failed
        if: failure()
        run: python3 scripts/watchdog_fail.py || true

      - name: Keepalive (GitHub disables scheduled workflows after 60 days without repo activity)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable" || echo "keepalive call failed (non-fatal)"

      - name: Job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          autopilot status | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep small debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            output/*/script.json
            output/*/qa_issues.json
            output/*/credits.json
          retention-days: 3
