[project]
name = "channel-autopilot"
version = "0.1.0"
description = "Automated YouTube channel pipeline (free stack)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "piper-tts>=1.3",
    "kokoro-onnx>=0.4",
    "numpy>=1.26",
    "Pillow>=10.0",
    "playwright>=1.50",   # drives headless Chrome for the data channel's motion graphics
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
autopilot = "autopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
