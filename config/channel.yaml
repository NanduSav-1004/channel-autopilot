niche: evergreen science and technology explainers
audience: English, US/UK
formats:
  long:
    target_minutes: [8, 12]
    target_words: 1500   # ~10 min at the Piper voice's pace
    min_words: 1150      # QA floor; below ~8 min there are no mid-roll ads
    min_sections: 6
    publish_hour_utc: 18   # go live at 14:00 ET / 19:00 UK (only when uploads are public)
    min_media_sections: 0.7   # at least this share of sections must have real images/footage, else retry
    min_source_chars: 6000   # thin Wikipedia articles cannot ground a 10-minute script
    per_day: 1
  short:
    per_day: 3
    max_seconds: 58
    publish_offsets_hours: [2, 6, 10]   # hours after the long video goes live; spreads Shorts through the day
# Safety rails from the Phase 0 policy findings
forbidden_topics:
  - medical advice
  - financial advice
  - legal advice
audio:
  music_style: ambient          # the soft pad you preferred; beat styles (upbeat, lofi, pulse) exist but are not used
  voices:                       # one is picked at random per video, never the same as the previous video's
    - {engine: kokoro, name: bm_george, speed: 1.1}
    - {engine: kokoro, name: am_michael, speed: 1.12}
    - {engine: gemini, name: Sadachbia}   # free tier ~20 requests/day/model; falls back automatically
  fallback: {engine: kokoro, name: am_michael, speed: 1.12}
malayalam:                      # a second channel: the same videos, translated and spoken in Malayalam
  enabled: true                 # still does nothing until the Malayalam channel's login exists (YOUTUBE_REFRESH_TOKEN_ML)
  publish_hour_utc: 16          # 9:30 PM IST
  shorts: true                  # Malayalam Shorts from the same Short scripts as the English channel
  short_offsets_hours: [10, 15, 21]   # after the long video: 7:30 AM, 12:30 PM, 6:30 PM IST the next day
  voices:                       # rotated, never the same twice in a row (Gemini, on the Malayalam project's own key)
    - {engine: gemini, name: Charon}
    - {engine: gemini, name: Achird}
    - {engine: gemini, name: Sulafat}
topics:
  enabled: true                 # the mix below is used only when this is true (approved by the owner 2026-10-28)
  mix:                           # how often each kind of topic is picked (the least-served kind goes next)
    core: 0.50                   # evergreen science and technology
    space: 0.20                  # space and astronomy (NASA media is added for these)
    what_if: 0.15                # "what if" questions answered with established science
    history: 0.15                # history mysteries and the history of science
cta:                             # calls to action (approved to build 2026-10-31; samples first, then switch on)
  long_closing: false            # one varied spoken line at the end of long videos: subscribe for the next explainer (Malayalam: translated with the script)
  short_tag: false               # for the last ~2.5 s of a Short, a tag on screen: "full video on the channel" (no spoken ask)
render:
  mascot: shorts                 # a talking character in the corner: false | shorts | all (approved for Shorts only, 2026-10-27)
  data_shots: shorts             # animated number, bar, timeline and line-chart shots at the moment the figures are spoken: false | shorts | all
  mascot_style: bulb             # bulb ("Beam", chosen) | atom ("Orbit")
dry_run: true   # no public upload until the upload spike passes and this is set to false
